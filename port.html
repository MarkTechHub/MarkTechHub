<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkTechHub</title>
    <link rel="stylesheet" href="style.css">
    <style>

header {
      position: sticky;
      top: 0;
      background-color: #111;
      color: white;
      padding: 15px 20px;
      z-index: 999;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      border-radius: 50px;
      animation: spin 20s linear infinite;
    }
    @keyframes spin {
      form {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    .logo h1 {
      font-size: 1.8rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    nav ul li a:hover {
      color: #ff6600;
    }

    .menu-toggle {
      display: none;
      cursor: pointer;
      color: white;
      font-size: 1.5rem;
    }

    @media (max-width: 768px) {
      nav {
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
        background: #111;
        padding: 10px;
        display: none;
      }

      nav ul.show {
        display: flex;
      }

      .menu-toggle {
        display: block;
      }
    }

    .hero {
      background: url('image/hero-bg.jpg') center/cover no-repeat;
      padding: 100px 20px;
      color: black;
      text-align: center;
    }

    .hero h2 {
      font-size: 2.5rem;
    }


        #portfolio {
    text-align: center;
    padding: 50px;
    background: #f8f8f8;
}
/* Improved High-Performance Grid */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 15px;
    padding: 10px;
}

/* Card – Small, Clean, PlayStore Style */
.gallery-item {
    background: white;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #eee;
    transition: transform 0.2s ease;
}

.gallery-item:hover {
    transform: scale(1.03);
}

/* Image – Smaller for fast loading */
.gallery-item img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
}

/* Button */
.btn {
    display: block;
    text-align: center;
    margin-top: 8px;
    padding: 7px;
    background: #ff6600;
    color: white;
    border-radius: 6px;
    font-size: 14px;
}

.btn:hover {
    background: #e55d00;
}

/* Title text */
.gallery-item h3 {
    font-size: 15px;
    margin-top: 8px;
    font-weight: 600;
}

.gallery-item p {
    font-size: 12px;
    color: #666;
}


/* --- Perfect Responsive Breakpoints --- */

/* Tablets (3 or 4 per row) */
@media (max-width: 992px) {
    .gallery {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }
}

/* Smartphones (PlayStore Style) */
@media (max-width: 600px) {
    .gallery {
        grid-template-columns: repeat(3, 1fr); /* 3 apps per row like PlayStore */
        gap: 10px;
    }

    .gallery-item {
        padding: 8px;
    }

    .gallery-item img {
        height: 100px;
    }

    .gallery-item h3 {
        font-size: 13px;
    }

    .gallery-item p {
        font-size: 11px;
    }

    .btn {
        font-size: 12px;
        padding: 6px;
    }
}


    </style>
</head>
