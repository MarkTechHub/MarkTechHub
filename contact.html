<script>
const btn = document.getElementById("techAssistantBtn");
const assistant = document.getElementById("techAssistant");

btn.onclick = toggleAssistant;

function toggleAssistant() {
  assistant.classList.toggle("hidden");
}

function extractKeyword(question) {
  return question
    .toLowerCase()
    .replace(/maana ya|ni nini|what is|importace of|types of|explain|define|meaning of|explain/gi, "")
    .trim();
}

async function askTech() {
  const input = document.getElementById("questionInput");
  const results = document.getElementById("assistantResults");

  let question = input.value.trim();
  if (question.length < 3) return;

  const keyword = extractKeyword(question);

  results.innerHTML = "⏳ Natafuta jibu...";

  const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(keyword)}`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.type === "https://mediawiki.org/wiki/HyperSwitch/errors/not_found") {
      results.innerHTML = "❌ Hakuna jibu lililopatikana. Jaribu swali jingine.";
      return;
    }

    results.innerHTML = `
      <div style="font-size:14px;line-height:1.6;color:#e5e7eb">
        <strong>${data.title}</strong><br><br>
        ${data.extract}
      </div>
    `;
  } catch (error) {
    results.innerHTML = "⚠️ Tatizo la mtandao. Tafadhali jaribu tena.";
  }
}
</script>
