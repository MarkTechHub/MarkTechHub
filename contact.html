<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
    <style>
        body{
            background-color: rgb(135, 198, 237);
            background-size: 400% 400%;
             
        }

      
    header {
      position: sticky;
      top: 0;
      background-color: #111;
      color: white;
      padding: 15px 20px;
      z-index: 999;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      border-radius: 50px;
      animation: spin 20s linear infinite;
    }
    @keyframes spin {
      form {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .logo h1 {
      font-size: 1.8rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    nav ul li a:hover {
      color: #ff6600;
    }

    .menu-toggle {
      display: none;
      cursor: pointer;
      color: white;
      font-size: 1.5rem;
    }

    @media (max-width: 768px) {
      nav {
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
        background: #111;
        padding: 10px;
        display: none;
      }

      nav ul.show {
        display: flex;
      }

      .menu-toggle {
        display: block;
      }
    }

    .hero {
      background: url('image/hero-bg.jpg') center/cover no-repeat;
      padding: 100px 20px;
      color: black;
      text-align: center;
    }

    .hero h2 {
      font-size: 2.5rem;
    }

         .contact-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            text-align: center;
        }
        

        .contact-info {
            max-width: 400px;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin: 20px;
        }

        .contact-info h2 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #007bff;
        }

        .contact-info p {
            font-size: 18px;
            margin: 10px 0;
            color: #555;
        }

        .social-links {
            margin-top: 15px;
        }

        .social-links a {
            display: inline-block;
            margin: 0 10px;
            font-size: 22px;
            color: #007bff;
            transition: 0.3s;
        }

        .social-links a:hover {
            color: #ff4500;
        }

    </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="image2/MY LOGO.png"  alt="MarkTechHub logo" class="logo">
    </div>
    <div class="menu-toggle" onclick="toggleMenu()">&#9776;</div>
    <nav>
      <ul id="nav-links">
        <li><a href="index.html">home</a></li>
        <li><a href="about.html">about us</a></li>
        <li><a href="port.html">Portfolio</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>


    <center><div class="contact-info">
        <h2>Get in Touch</h2>
        <p><i class="fas fa-phone"></i> +255 618 650 098</p>
        <p><i class="fab fa-whatsapp"></i> +255 687 750 098</p>
        <p><i class="fas fa-envelope"></i> markmwaitolola4@gmail.com</p>
        <P>OR</P>
        <p><i class="fas fa-envelope"></i>markmartinmwaitolola@gmail.com</p>
        <div class="social-links">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-whatsapp"></i></a>
        </div>
    </div>

    <script>
       function toggleMenu() {
      document.getElementById('nav-links').classList.toggle('show');
    }
    </script>

</body>
</html>
