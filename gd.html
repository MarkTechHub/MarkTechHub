<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MarkTechHub - Jukwaa la kiteknolojia kwa wabunifu na watengenezaji wa wavuti. Pata suluhisho za kisasa za IT.">
    <meta name="keywords" content="MarkTechHub, Web Design, Logo Design, Graphic Design,businesses card,poster, Programming">
    <meta name="author" content="Mark Martin Mwaitolola">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<title>Graphics Design Tutorials</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f4f4f4;
    }
    header {
      position: sticky;
      top: 0;
      background-color: #111;
      color: white;
      padding: 15px 20px;
      z-index: 999;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      width: 60px;
      height: 60px;
      border-radius: 50px;
      animation: spin 20s linear infinite;
    }
        .logo h1 {
      font-size: 1.8rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }
    nav ul li a:hover {
      color: #ff6600;
    }

    .menu-toggle {
      display: none;
      cursor: pointer;
      color: white;
      font-size: 1.5rem;
    }

    @media (max-width: 768px) {
      nav {
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
        background: #111;
        padding: 10px;
        display: none;
      }

      nav ul.show {
        display: flex;
      }

      .menu-toggle {
        display: block;
      }
    }
    .container {
        display: grid;
        grid-template-columns: 250px 1fr 250px;
        gap: 15px;
        padding: 20px;
    }
    .video-list, .side-links {
        background: #fff;
        padding: 15px;
        border-radius: 10px;
    }
    .video-list h3, .side-links h3 {
        margin-top: 0;
    }
    .video-thumb {
        width: 100%;
        background: #ddd;
        height: 80px;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        margin-bottom: 10px;
    }
    .video-display {
        background: #000;
        height: 350px;
        border-radius: 10px;
        margin-bottom: 15px;
    }
    video {
        width: 100%;
        height: 100%;
        border-radius: 10px;
    }
    .comment-box {
        background: #fff;
        padding: 15px;
        border-radius: 10px;
        margin-top: 10px;
    }
    .comment-box textarea {
        width: 100%;
        height: 70px;
        border-radius: 8px;
        padding: 10px;
    }
    .btn {
        background: #333;
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        text-decoration: none;
        display: inline-block;
        margin-top: 10px;
    }
    .view-more {
        margin-top: 20px;
        display: inline-block;
    }
    /* Responsive */
    @media (max-width: 768px) {
        .container {
            grid-template-columns: 1fr;
        }
        .video-display {
            height: 250px;
        }
        .video-thumb {
            height: 60px;
        }
    }
</style>
</head>
<body>
<header>
        <div class="logo">
            <img src="image2/MY LOGO.png"  alt="MarkTechHub logo" class="logo">
          </div>
        <div class="menu-toggle" onclick="toggleMenu()">&#9776;</div>
        <nav>
          <ul id="nav-links">
            <li><a href="index.html">home</a></li>
            <li><a href="about.html">about us</a></li>
            <li><a href="port.html">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </header>

<div class="container">
    <!-- Left Video List -->
    <div class="video-list">
        <h3>Seasons</h3>
        <div class="video-thumb" onclick="playVideo('video1.mp4')">Season 1</div>
        <div class="video-thumb" onclick="playVideo('video2.mp4')">Season 2</div>
        <div class="video-thumb" onclick="playVideo('video3.mp4')">Season 3</div>
        <div class="video-thumb" onclick="playVideo('video4.mp4')">Season 4</div>
        <a class="btn view-more" href="#">View More</a>
    </div>

    <!-- Video Display Center -->
    <div>
        <div class="video-display">
            <video id="mainVideo" controls>
                <source src="video1.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Comments and Viewers -->
        <div class="comment-box">
            <h3>Comments</h3>
            <textarea placeholder="Write your comment..."></textarea>
            <a class="btn" href="#">Post Comment</a>
        </div>
    </div>

    <!-- Right Side Links -->
    <div class="side-links">
        <h3>Other Tutorials</h3>
        <ul>
            <li><a href="#">Intro to Graphic Design</a></li>
            <li><a href="#">Color Theory</a></li>
            <li><a href="#">Branding Techniques</a></li>
            <li><a href="#">Photoshop Basics</a></li>
        </ul>
    </div>
</div>

<script>
function playVideo(file) {
    document.getElementById("mainVideo").src = file;
    document.getElementById("mainVideo").play();
}
</script>
</body>
</html>
